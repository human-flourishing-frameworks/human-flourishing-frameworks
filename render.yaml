services:
  - type: web
    name: human-flourishing-frameworks
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: 10000
    domains:
      - human-flourishing-frameworks.onrender.com
