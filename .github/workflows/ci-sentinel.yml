name: CI Sentinel

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sentinel:
    name: Run CI sentinel for master
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Run unittest discovery and manage sentinel issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/manage_ci_sentinel_issue.py
