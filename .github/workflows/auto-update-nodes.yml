name: Auto-Update Deployed Nodes

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

jobs:
  notify-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get latest version
        id: version
        run: |
          VERSION=$(grep version setup.py | head -1 | awk '{print $2}' | tr -d '",')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create update notification
        run: |
          cat > update-notification.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repo": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "message": "New update available - nodes will auto-update within 1 hour"
          }
          EOF

      - name: Publish update notification
        run: |
          echo "Update notification created:"
          cat update-notification.json

      - name: Trigger Render webhook (if configured)
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }} \
              -H "Content-Type: application/json" \
              -d '{"version": "${{ steps.version.outputs.version }}"}'
          fi

  verify-nodes:
    runs-on: ubuntu-latest
    steps:
      - name: Check live deployment
        run: |
          curl -s https://human-flourishing-frameworks.onrender.com/health | grep -q ok && echo "✅ Render deployment live"

      - name: Notify deployment health
        run: |
          echo "Deployment check passed"
