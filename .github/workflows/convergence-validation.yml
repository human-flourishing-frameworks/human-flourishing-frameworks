name: convergence-validation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Run convergence guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Show Python version
        run: python --version

      - name: Validate theorem register guardrails
        run: python -m unittest discover -s tests -p "test_theorem_register.py" -t .

      - name: Validate schema, source-class, and lore guardrails
        run: python -m unittest discover -s tests -p "test_schema_source_lore.py" -t .

      - name: Validate recovery artifacts
        run: python -m unittest discover -s tests -p "test_recovery_artifacts.py" -t .

      - name: Validate CI workflow guardrails
        run: python -m unittest discover -s tests -p "test_ci_workflow.py" -t .

      - name: Validate release hardening artifacts
        run: python -m unittest discover -s tests -p "test_release_artifacts.py" -t .

      - name: Validate release bundle builder
        run: python -m unittest discover -s tests -p "test_release_bundle.py" -t .

      - name: Validate restore drill runner
        run: python -m unittest discover -s tests -p "test_restore_drill.py" -t .

      - name: Validate wish anchor guardrails
        run: python -m unittest discover -s tests -p "test_wish_anchor.py" -t .

      - name: Validate public-readiness documentation guardrails
        run: python -m unittest discover -s tests -p "test_public_readiness_docs.py" -t .

      - name: Validate seven-anchors self-correction guardrails
        run: python -m unittest discover -s tests -p "test_seven_anchors_self_correction.py" -t .

      - name: Validate anchor taxonomy and data-center infrastructure guardrails
        run: |
          python -m unittest discover -s tests -p "test_anchor_taxonomy.py" -t .
          python -m unittest discover -s tests -p "test_bettersafe_data_center_anchor.py" -t .

      - name: Validate canonical convergence and non-flat signal guardrails
        run: |
          python -m unittest discover -s tests -p "test_canonical_convergence_doc.py" -t .
          python -m unittest discover -s tests -p "test_spine_pointer.py" -t .

      - name: Validate Lantern doctrine and TARDIS return-door guardrails
        run: |
          python -m unittest discover -s tests -p "test_lantern_doctrine_spine.py" -t .
          python -m unittest discover -s tests -p "test_lantern_keystone_tardis_anchor.py" -t .
          python -m unittest discover -s tests -p "test_tardis_watch_return_door_design.py" -t .
          python -m unittest discover -s tests -p "test_tardis_boarding_manifest.py" -t .

      - name: Validate operator spine and BetterSafe game seed guardrails
        run: |
          python -m unittest discover -s tests -p "test_operator_lantern_convergence.py" -t .
          python -m unittest discover -s tests -p "test_bettersafe_game_seed_plan.py" -t .

      - name: Validate essential-needs crisis navigator guardrails
        run: python -m unittest discover -s tests -p "test_essential_needs_privacy.py" -t .

      - name: Validate Lantern beacon handoff guardrails
        run: python -m unittest discover -s tests -p "test_lantern_beacon_handoff.py" -t .
